<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sesame Robot Simulator</title>
<style>
:root {
  --orange: #ff8c42;
  --orange-dark: #cc6b29;
  --orange-glow: rgba(255,140,66,0.25);
  --bg: #0a0a0f;
  --panel: #141420;
  --panel2: #1c1c2a;
  --border: #2a2a3a;
  --text: #e0e0e0;
  --text-dim: #888;
  --green: #00e800;
  --green-dim: #004800;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Roboto,sans-serif;min-height:100vh;padding:12px}
h1{color:var(--orange);font-size:20px;font-weight:700;letter-spacing:2px;text-align:center;margin-bottom:12px;text-shadow:0 0 20px var(--orange-glow)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:960px;margin:0 auto}
@media(max-width:680px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px}
.panel-title{font-size:10px;font-weight:700;color:var(--orange);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}

/* OLED */
#oled-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
#oled{border:2px solid #1a3a1a;border-radius:4px;image-rendering:pixelated;image-rendering:crisp-edges;display:block;max-width:100%;background:#000}
#face-label{font-size:11px;color:var(--text-dim);font-family:monospace;letter-spacing:1px}

/* Robot diagram */
#robot-wrap{display:flex;justify-content:center}
#robot{border-radius:8px;max-width:100%}

/* Servo panel */
.servo-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.servo-row{display:flex;align-items:center;gap:6px}
.servo-name{font-family:monospace;font-size:11px;color:var(--orange);min-width:28px;font-weight:700}
.servo-slider{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:var(--border);outline:none;cursor:pointer}
.servo-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--orange);cursor:pointer}
.servo-val{font-family:monospace;font-size:11px;color:var(--text-dim);min-width:30px;text-align:right}

/* Commands */
.cmd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.cmd-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 4px;border-radius:8px;font-size:12px;cursor:pointer;transition:all 0.15s;text-transform:capitalize;font-family:inherit}
.cmd-btn:hover{border-color:var(--orange);color:var(--orange);background:#1e1e30}
.cmd-btn.active{background:var(--orange);color:#000;border-color:var(--orange);font-weight:700}
.cmd-btn:disabled{opacity:0.4;cursor:not-allowed}

/* Controls */
.controls{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.ctrl-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;transition:all 0.15s}
.ctrl-btn:hover{border-color:var(--orange);color:var(--orange)}
.ctrl-btn.primary{background:var(--orange);border-color:var(--orange);color:#000;font-weight:700}
.speed-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim)}
.speed-row input{width:80px}

/* Step log */
#step-log{font-family:monospace;font-size:10px;color:var(--text-dim);max-height:80px;overflow-y:auto;padding:4px;background:var(--bg);border-radius:4px;margin-top:8px;line-height:1.6}
#step-log .current{color:var(--orange)}

/* Full-width bottom panels */
.full{grid-column:1/-1}
</style>
</head>
<body>

<h1>⬡ SESAME ROBOT SIMULATOR</h1>

<div class="grid">

  <!-- OLED Face -->
  <div class="panel">
    <div class="panel-title">OLED Face Display</div>
    <div id="oled-wrap">
      <canvas id="oled" width="384" height="192"></canvas>
      <div id="face-label">idle</div>
    </div>
  </div>

  <!-- Robot diagram -->
  <div class="panel">
    <div class="panel-title">Robot — Top-Down View</div>
    <div id="robot-wrap">
      <canvas id="robot" width="340" height="280"></canvas>
    </div>
  </div>

  <!-- Servos -->
  <div class="panel">
    <div class="panel-title">Servo Positions</div>
    <div class="servo-grid" id="servo-panel"></div>
  </div>

  <!-- Commands -->
  <div class="panel">
    <div class="panel-title">Commands</div>
    <div class="cmd-grid" id="cmd-grid"></div>
    <div class="controls">
      <button class="ctrl-btn primary" id="btn-stop">■ Stop</button>
      <div class="speed-row">
        Speed: <input type="range" id="speed-slider" min="25" max="300" value="100" style="width:70px">
        <span id="speed-val">1×</span>
      </div>
    </div>
    <div id="step-log"></div>
  </div>

</div>

    { servos:{R1:90,L2:90}, delay:FD },
    { servos:{R3:180,L4:180}, delay:FD },
    { servos:{R1:135,L2:135}, delay:FD },
    { face:'stand', mode:'once', servos:STAND, delay:0 }
  ],
};

// ─────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────
let state = {
  servos: {R1:90,R2:90,L1:90,L2:90,R4:90,R3:90,L3:90,L4:90},
  face: 'idle',
  faceMode: 'loop',
  faceFrameIdx: 0,
  faceFrameTimer: null,
  faceDir: 1,
  animTimer: null,
  animStepIdx: 0,
  animName: null,
  speed: 1.0,
};

// ─────────────────────────────────────────────────────────────────────
// OLED RENDERER
// ─────────────────────────────────────────────────────────────────────
const oledCanvas = document.getElementById('oled');
const oledCtx = oledCanvas.getContext('2d');
const SCALE = 3;

function renderFaceBitmap(name) {
  const key = 'epd_bitmap_' + name;
  const data = BITMAPS[key];
  oledCtx.fillStyle = '#000';
  oledCtx.fillRect(0, 0, 384, 192);
  if (!data || data.length < 1024) {
    // No bitmap — draw blank screen with subtle border glow
    return;
  }
  const imgData = oledCtx.createImageData(384, 192);
  const d = imgData.data;
  for (let y = 0; y < 64; y++) {
    for (let x = 0; x < 128; x++) {
      const byteIdx = y * 16 + (x >> 3);
      const bit = (data[byteIdx] >> (7 - (x & 7))) & 1;
      for (let sy = 0; sy < SCALE; sy++) {
        for (let sx = 0; sx < SCALE; sx++) {
          const i = ((y*SCALE+sy)*384 + (x*SCALE+sx)) * 4;
          if (bit) {
            d[i]=0; d[i+1]=232; d[i+2]=0; d[i+3]=255;
          } else {
            d[i]=0; d[i+1]=8; d[i+2]=0; d[i+3]=255;
          }
        }
      }
    }
  }
  oledCtx.putImageData(imgData, 0, 0);
}

// ─────────────────────────────────────────────────────────────────────
// FACE ANIMATOR
// ─────────────────────────────────────────────────────────────────────
function setFace(name, mode) {
  clearTimeout(state.faceFrameTimer);
  state.face = name;
  state.faceMode = mode || 'loop';
  state.faceFrameIdx = 0;
  state.faceDir = 1;
  document.getElementById('face-label').textContent = name;
  renderCurrentFaceFrame();
  scheduleFaceFrame();
}

function renderCurrentFaceFrame() {
  const frames = FACE_FRAMES[state.face] || [];
  const frameName = frames[state.faceFrameIdx] || null;
  if (frameName) {
    const short = frameName.replace('epd_bitmap_', '');
    renderFaceBitmap(short);
  } else {
    // blank
    oledCtx.fillStyle = '#000';
    oledCtx.fillRect(0,0,384,192);
  }
}

function scheduleFaceFrame() {
  const frames = FACE_FRAMES[state.face] || [];
  if (frames.length <= 1) return;
  const fps = FACE_FPS[state.face] || 1;
  state.faceFrameTimer = setTimeout(() => {
    advanceFaceFrame();
    scheduleFaceFrame();
  }, 1000 / fps);
}

function advanceFaceFrame() {
  const frames = FACE_FRAMES[state.face] || [];
  if (frames.length <= 1) return;
  const mode = state.faceMode;
  if (mode === 'loop') {
    state.faceFrameIdx = (state.faceFrameIdx + 1) % frames.length;
  } else if (mode === 'once') {
    state.faceFrameIdx = Math.min(state.faceFrameIdx + 1, frames.length - 1);
  } else { // boomerang
    state.faceFrameIdx += state.faceDir;
    if (state.faceFrameIdx >= frames.length - 1) {
      state.faceFrameIdx = frames.length - 1;
      state.faceDir = -1;
    } else if (state.faceFrameIdx <= 0) {
      state.faceFrameIdx = 0;
      state.faceDir = 1;
    }
  }
  renderCurrentFaceFrame();
}

// ─────────────────────────────────────────────────────────────────────
// ROBOT DIAGRAM
// ─────────────────────────────────────────────────────────────────────
const robotCanvas = document.getElementById('robot');
const robotCtx = robotCanvas.getContext('2d');
const W = 340, H = 280;

function drawRobot() {
  const ctx = robotCtx;
  ctx.clearRect(0,0,W,H);

  // Background
  ctx.fillStyle = '#0e0e18';
  ctx.fillRect(0,0,W,H);

  // Grid dots
  ctx.fillStyle = '#1a1a28';
  for(let x=20;x<W;x+=20) for(let y=20;y<H;y+=20) {
    ctx.beginPath(); ctx.arc(x,y,1,0,6.28); ctx.fill();
  }

  const cx = W/2, cy = H/2;
  const BW = 100, BH = 70;
  const HIP = 52, KNEE = 44;

  // Legs: {corner, outDir, hipServo, kneeServo, label}
  const legs = [
    { cx:cx+BW/2, cy:cy-BH/2, dir:-Math.PI*0.35, hip:'R1', knee:'R2', label:'FR' },
    { cx:cx-BW/2, cy:cy-BH/2, dir:-Math.PI*0.65, hip:'L1', knee:'L2', label:'FL' },
    { cx:cx+BW/2, cy:cy+BH/2, dir: Math.PI*0.35, hip:'R4', knee:'R3', label:'BR' },
    { cx:cx-BW/2, cy:cy+BH/2, dir: Math.PI*0.65, hip:'L4', knee:'L3', label:'BL' },
  ];

  legs.forEach(leg => {
    const hv = state.servos[leg.hip];
    const kv = state.servos[leg.knee];
    // Map servo 0-180 → ±70° around base direction
    const hipDir  = leg.dir + (hv - 90) * (Math.PI * 0.78 / 90);
    const kDir    = hipDir  + (kv - 90) * (Math.PI * 0.55 / 90);

    const hx = leg.cx + Math.cos(hipDir) * HIP;
    const hy = leg.cy + Math.sin(hipDir) * HIP;
    const fx = hx + Math.cos(kDir) * KNEE;
    const fy = hy + Math.sin(kDir) * KNEE;

    // Shadow
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(leg.cx+2,leg.cy+2); ctx.lineTo(hx+2,hy+2); ctx.stroke();
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(hx+2,hy+2); ctx.lineTo(fx+2,fy+2); ctx.stroke();

    // Hip segment
    ctx.strokeStyle = '#c0c0d0';
    ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(leg.cx,leg.cy); ctx.lineTo(hx,hy); ctx.stroke();

    // Knee segment
    ctx.strokeStyle = '#8080a0';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(fx,fy); ctx.stroke();

    // Shoulder joint
    ctx.fillStyle = '#ff8c42';
    ctx.beginPath(); ctx.arc(leg.cx,leg.cy,6,0,6.28); ctx.fill();

    // Elbow joint
    ctx.fillStyle = '#e06030';
    ctx.beginPath(); ctx.arc(hx,hy,4,0,6.28); ctx.fill();

    // Foot
    ctx.fillStyle = '#6060a0';
    ctx.beginPath(); ctx.arc(fx,fy,3,0,6.28); ctx.fill();

    // Angle arcs at shoulder
    ctx.strokeStyle = 'rgba(255,140,66,0.25)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(leg.cx, leg.cy, 16, leg.dir - Math.PI*0.78, leg.dir + Math.PI*0.78);
    ctx.stroke();

    // Leg label + angles
    const lx = leg.cx + Math.cos(leg.dir) * (HIP + KNEE + 18);
    const ly = leg.cy + Math.sin(leg.dir) * (HIP + KNEE + 18);
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff8c42';
    ctx.fillText(leg.label, lx, ly - 8);
    ctx.font = '9px monospace';
    ctx.fillStyle = '#999';
    ctx.fillText(`${leg.hip}:${hv}°`, lx, ly + 3);
    ctx.fillText(`${leg.knee}:${kv}°`, lx, ly + 13);
  });

  // Body
  ctx.fillStyle = '#ff8c42';
  ctx.strokeStyle = '#e06020';
  ctx.lineWidth = 2;
  const r = 10;
  ctx.beginPath();
  ctx.roundRect(cx-BW/2, cy-BH/2, BW, BH, r);
  ctx.fill(); ctx.stroke();

  // Body labels
  ctx.fillStyle = '#1a1a2e';
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('▲ FRONT', cx, cy - BH/2 + 14);
  ctx.fillText('▼ BACK', cx, cy + BH/2 - 5);
  ctx.font = '9px monospace';
  ctx.fillStyle = 'rgba(26,26,46,0.8)';
  ctx.fillText('SESAME', cx, cy + 5);
}

// ─────────────────────────────────────────────────────────────────────
// SERVO PANEL
// ─────────────────────────────────────────────────────────────────────
const SERVO_ORDER = ['R1','R2','L1','L2','R4','R3','L4','L3'];
const SERVO_LABELS = { R1:'R1 Hip FR',R2:'R2 Knee FR',L1:'L1 Hip FL',L2:'L2 Knee FL',R4:'R4 Hip BR',R3:'R3 Knee BR',L4:'L4 Hip BL',L3:'L3 Knee BL' };

function buildServoPanel() {
  const el = document.getElementById('servo-panel');
  SERVO_ORDER.forEach(name => {
    const row = document.createElement('div');
    row.className = 'servo-row';
    row.innerHTML = `
      <span class="servo-name" title="${SERVO_LABELS[name]}">${name}</span>
      <input class="servo-slider" type="range" min="0" max="180" value="${state.servos[name]}"
             id="sv-${name}" data-servo="${name}">
      <span class="servo-val" id="sv-val-${name}">${state.servos[name]}°</span>
    `;
    el.appendChild(row);
  });
  el.addEventListener('input', e => {
    if (e.target.classList.contains('servo-slider')) {
      const name = e.target.dataset.servo;
      const val = parseInt(e.target.value);
      stopAnim();
      setServo(name, val);
    }
  });
}

function setServo(name, angle) {
  state.servos[name] = angle;
  const sl = document.getElementById('sv-'+name);
  const vl = document.getElementById('sv-val-'+name);
  if(sl) sl.value = angle;
  if(vl) vl.textContent = angle + '°';
  drawRobot();
}

function setServos(obj) {
  if (!obj) return;
  Object.entries(obj).forEach(([k,v]) => setServo(k, v));
}

function syncServoPanelFromState() {
  SERVO_ORDER.forEach(name => {
    const sl = document.getElementById('sv-'+name);
    const vl = document.getElementById('sv-val-'+name);
    if(sl) sl.value = state.servos[name];
    if(vl) vl.textContent = state.servos[name] + '°';
  });
  drawRobot();
}

// ─────────────────────────────────────────────────────────────────────
// ANIMATION PLAYER
// ─────────────────────────────────────────────────────────────────────
function stopAnim() {
  clearTimeout(state.animTimer);
  state.animTimer = null;
  state.animName = null;
  document.querySelectorAll('.cmd-btn.active').forEach(b => b.classList.remove('active'));
}

function playAnim(name) {
  stopAnim();
  const seq = ANIMATIONS[name];
  if (!seq) return;
  state.animName = name;
  state.animStepIdx = 0;
  document.querySelectorAll('.cmd-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll(`.cmd-btn[data-cmd="${name}"]`).forEach(b => b.classList.add('active'));
  clearStepLog();
  runStep(seq);
}

function runStep(seq) {
  if (state.animStepIdx >= seq.length) {
    stopAnim();
    logStep('✓ done');
    return;
  }
  const step = seq[state.animStepIdx++];
  logStep(`step ${state.animStepIdx}: ${describeStep(step)}`);

  if (step.face) setFace(step.face, step.mode || 'loop');
  if (step.servos) setServos(step.servos);

  const delay = (step.delay || 0) / state.speed;
  if (delay > 0) {
    state.animTimer = setTimeout(() => runStep(seq), delay);
  } else {
    runStep(seq);
  }
}

function describeStep(step) {
  const parts = [];
  if (step.face) parts.push(`face:${step.face}`);
  if (step.servos) {
    const sv = Object.entries(step.servos).map(([k,v])=>`${k}=${v}`).join(' ');
    parts.push(sv);
  }
  if (step.delay) parts.push(`⏱${step.delay}ms`);
  return parts.join(' | ') || '(no-op)';
}

// ─────────────────────────────────────────────────────────────────────
// COMMAND BUTTONS
// ─────────────────────────────────────────────────────────────────────
const COMMANDS = [
  { cmd:'rest', label:'😴 Rest' },
  { cmd:'stand', label:'🧍 Stand' },
  { cmd:'forward', label:'⬆️ Walk' },
  { cmd:'backward', label:'⬇️ Back' },
  { cmd:'left', label:'↩️ Left' },
  { cmd:'right', label:'↪️ Right' },
  { cmd:'wave', label:'👋 Wave' },
  { cmd:'dance', label:'💃 Dance' },
  { cmd:'swim', label:'🏊 Swim' },
  { cmd:'point', label:'👉 Point' },
  { cmd:'pushup', label:'💪 Pushup' },
  { cmd:'bow', label:'🙇 Bow' },
  { cmd:'cute', label:'🥰 Cute' },
  { cmd:'freaky', label:'😱 Freaky' },
  { cmd:'worm', label:'🐛 Worm' },
  { cmd:'shake', label:'🫨 Shake' },
  { cmd:'shrug', label:'🤷 Shrug' },
  { cmd:'dead', label:'💀 Dead' },
  { cmd:'crab', label:'🦀 Crab' },
];

function buildCommandGrid() {
  const el = document.getElementById('cmd-grid');
  COMMANDS.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cmd-btn';
    btn.dataset.cmd = c.cmd;
    btn.textContent = c.label;
    btn.addEventListener('click', () => playAnim(c.cmd));
    el.appendChild(btn);
  });
}

// ─────────────────────────────────────────────────────────────────────
// STEP LOG
// ─────────────────────────────────────────────────────────────────────
function logStep(msg) {
  const log = document.getElementById('step-log');
  // Remove 'current' class from all
  log.querySelectorAll('.current').forEach(e => e.classList.remove('current'));
  const div = document.createElement('div');
  div.className = 'current';
  div.textContent = msg;
  log.appendChild(div);
  // Trim to last 20 lines
  while (log.children.length > 20) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}
function clearStepLog() {
  document.getElementById('step-log').innerHTML = '';
}

// ─────────────────────────────────────────────────────────────────────
// CONTROLS
// ─────────────────────────────────────────────────────────────────────
document.getElementById('btn-stop').addEventListener('click', () => {
  stopAnim();
  logStep('■ stopped');
});

const speedSlider = document.getElementById('speed-slider');
const speedVal = document.getElementById('speed-val');
speedSlider.addEventListener('input', () => {
  state.speed = speedSlider.value / 100;
  speedVal.textContent = state.speed.toFixed(2).replace(/\.?0+$/,'') + '×';
});

// ─────────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────────
buildServoPanel();
buildCommandGrid();
setFace('idle', 'boomerang');
drawRobot();
</script>
