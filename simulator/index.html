<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sesame Robot Simulator</title>
<style>
:root {
  --orange:     #ff8c42;
  --orange-dk:  #cc6020;
  --orange-dim: rgba(255,140,66,0.18);
  --bg:         #090910;
  --panel:      #111118;
  --panel2:     #18181f;
  --border:     #252530;
  --text:       #d8d8e8;
  --text-dim:   #666680;
  --green:      #00e000;
  --green-dim:  #003800;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh;
  padding:12px;
}

/* ── layout ── */
h1{
  color:var(--orange);
  font-size:17px;
  font-weight:700;
  letter-spacing:3px;
  text-transform:uppercase;
  text-align:center;
  margin-bottom:12px;
  opacity:.9;
}
.grid{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:10px;
  max-width:900px;
  margin:0 auto;
}
@media(max-width:660px){.grid{grid-template-columns:1fr}}
.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px;
}
.label{
  font-size:9px;
  font-weight:700;
  color:var(--orange);
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:8px;
  opacity:.8;
}

/* ── oled ── */
#oled-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
#oled{
  border:2px solid #0a2010;
  border-radius:3px;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  display:block;
  width:100%;
  max-width:240px;
  height:auto;
}
#face-label{
  font-size:10px;
  color:var(--text-dim);
  font-family:monospace;
  letter-spacing:1px;
}

/* ── servos ── */
.servo-grid{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.servo-row{display:flex;align-items:center;gap:6px}
.sname{
  font-family:monospace;
  font-size:10px;
  color:var(--orange);
  min-width:26px;
  font-weight:700;
  opacity:.9;
}
.sslider{
  flex:1;
  -webkit-appearance:none;
  height:3px;
  border-radius:2px;
  background:var(--border);
  outline:none;
  cursor:pointer;
}
.sslider::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:12px;height:12px;
  border-radius:50%;
  background:var(--orange);
  cursor:pointer;
}
.sval{
  font-family:monospace;
  font-size:10px;
  color:var(--text-dim);
  min-width:32px;
  text-align:right;
}

/* ── robot panel ── */
#robot-wrap{display:flex;justify-content:center}
#robot{display:block;width:100%;max-width:500px;height:auto;border-radius:6px}

/* ── commands ── */
.cmd-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(68px,1fr));
  gap:5px;
  margin-top:4px;
}
.cmd-btn{
  background:var(--panel2);
  border:1px solid var(--border);
  color:var(--text);
  padding:7px 4px;
  border-radius:7px;
  font-size:11px;
  cursor:pointer;
  transition:border-color .12s, color .12s, background .12s;
  font-family:inherit;
  line-height:1.3;
}
.cmd-btn:hover{border-color:var(--orange);color:var(--orange)}
.cmd-btn.active{background:var(--orange);color:#000;border-color:var(--orange);font-weight:700}

/* ── controls ── */
.controls{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.ctrl-btn{
  background:var(--panel2);
  border:1px solid var(--border);
  color:var(--text);
  padding:5px 10px;
  border-radius:6px;
  font-size:11px;
  cursor:pointer;
  transition:border-color .12s;
}
.ctrl-btn:hover{border-color:var(--orange)}
.ctrl-btn.primary{background:var(--orange);border-color:var(--orange);color:#000;font-weight:700}
.ctrl-btn.walk-active{background:#22aa55;border-color:#22aa55;color:#fff;font-weight:700}
.speed-row{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-dim)}
.speed-row input[type=range]{width:65px}

/* ── step log ── */
#step-log{
  font-family:monospace;
  font-size:9px;
  color:var(--text-dim);
  max-height:56px;
  overflow-y:auto;
  padding:4px 6px;
  background:var(--bg);
  border-radius:4px;
  margin-top:6px;
  line-height:1.7;
}
#step-log .cur{color:var(--orange)}

/* ── right col stacks ── */
.right-col{display:flex;flex-direction:column;gap:10px}
.left-col{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>

<h1>⬡ Sesame Robot Simulator</h1>

<div class="grid">

  <!-- LEFT: OLED + Servos -->
  <div class="left-col">

    <div class="panel">
      <div class="label">OLED Display</div>
      <div id="oled-wrap">
        <canvas id="oled" width="384" height="192"></canvas>

    </div>

    <div class="panel">
      <div class="label">Servo Positions</div>

    </div>

  <div class="right-col">

      <div id="robot-wrap">
        <canvas id="robot" width="500" height="340"></canvas>
      </div>
    </div>

    <div class="panel">
      <div class="label">Commands</div>
      <div class="cmd-grid" id="cmd-grid"></div>
      <div class="controls">

          <input type="range" id="speed-slider" min="20" max="300" value="100">
          <span id="speed-val">1×</span>
        </div>
      </div>
      <div id="step-log"></div>
    </div>

  </div>
</div>

let state = {
  servos: {R1:90,R2:90,L1:90,L2:90,R4:90,R3:90,L3:90,L4:90},
  face:'idle', faceMode:'loop', faceFrameIdx:0, faceDir:1,
  faceFrameTimer:null, animTimer:null, animName:null, speed:1.0,
  pitch: 0, roll: 0,   // body orientation (radians); updated each frame
  frame: 0,            // draw-frame counter
  legChanged: [0,0,0,0], // frame each leg's servos were last set (FR,FL,BR,BL)
  gait: { active: false, time: 0, speed: 1.2, legIsStance: [true,true,true,true] },
};
// Which servo name belongs to which leg index (FR=0, FL=1, BR=2, BL=3)
const SERVO_LEG = {R1:0,R3:0, L1:1,L3:1, R2:2,R4:2, L2:3,L4:3};
const STANCE_FRAMES = 6; // frames of servo silence before a leg is considered grounded

// ─────────────────────────────────────────────────────────────────────────────
// OLED
// ─────────────────────────────────────────────────────────────────────────────
const oledCanvas = document.getElementById('oled');
const oledCtx    = oledCanvas.getContext('2d');

function renderFaceBitmap(name) {
  const data = BITMAPS['epd_bitmap_' + name];
  oledCtx.fillStyle = '#000';
  oledCtx.fillRect(0, 0, 384, 192);
  if (!data || data.length < 1024) return;
  const img = oledCtx.createImageData(384, 192);
  const d = img.data;
  for (let y = 0; y < 64; y++) {
    for (let x = 0; x < 128; x++) {
      const bit = (data[y*16 + (x>>3)] >> (7-(x&7))) & 1;
      for (let sy = 0; sy < 3; sy++) for (let sx = 0; sx < 3; sx++) {
        const i = ((y*3+sy)*384 + (x*3+sx)) * 4;
        d[i]=0; d[i+1]=bit?224:8; d[i+2]=0; d[i+3]=255;
      }
    }
  }
  oledCtx.putImageData(img, 0, 0);
}

function setFace(name, mode) {
  clearTimeout(state.faceFrameTimer);
  state.face = name; state.faceMode = mode||'loop';
  state.faceFrameIdx = 0; state.faceDir = 1;
  document.getElementById('face-label').textContent = name;
  _renderFaceFrame(); _scheduleFaceFrame();
}

function _renderFaceFrame() {
  const frames = FACE_FRAMES[state.face] || [];
  const f = frames[state.faceFrameIdx];
  if (f) renderFaceBitmap(f.replace('epd_bitmap_',''));
  else { oledCtx.fillStyle='#000'; oledCtx.fillRect(0,0,384,192); }
}

function _scheduleFaceFrame() {
  const frames = FACE_FRAMES[state.face] || [];
  if (frames.length <= 1) return;
  const fps = FACE_FPS[state.face] || 1;
  state.faceFrameTimer = setTimeout(() => { _advanceFaceFrame(); _scheduleFaceFrame(); }, 1000/fps);
}

function _advanceFaceFrame() {
  const frames = FACE_FRAMES[state.face] || [];
  if (frames.length <= 1) return;
  const mode = state.faceMode;
  if (mode === 'loop') {
    state.faceFrameIdx = (state.faceFrameIdx + 1) % frames.length;
  } else if (mode === 'once') {
    state.faceFrameIdx = Math.min(state.faceFrameIdx + 1, frames.length - 1);
  } else {
    state.faceFrameIdx += state.faceDir;
    if (state.faceFrameIdx >= frames.length-1) { state.faceFrameIdx = frames.length-1; state.faceDir = -1; }
    else if (state.faceFrameIdx <= 0)          { state.faceFrameIdx = 0;               state.faceDir =  1; }
  }
  _renderFaceFrame();
}

// ─────────────────────────────────────────────────────────────────────────────
// 3D ISOMETRIC ROBOT RENDERER
// ─────────────────────────────────────────────────────────────────────────────
const RC   = document.getElementById('robot');
const RCTX = RC.getContext('2d');
const CW = 500, CH = 340;

// Isometric projection constants
// X = right, Y = forward (front of robot), Z = up, floor at Z=0
const ISO_A   = Math.PI / 6;   // 30°
const ISO_COS = Math.cos(ISO_A);
const ISO_SIN = Math.sin(ISO_A);
const ISO_SCALE = 1.05;         // px per world-unit (mm)

// Canvas origin (screen centre for the world origin)
const OX = 250, OY = 182;

// Camera tracks the body during creep so the robot stays centred on screen
let cam = { x: 0, y: 0 };

function iso(wx, wy, wz) {
  const rx = wx - cam.x, ry = wy - cam.y;
  return [
    OX + (rx - ry) * ISO_COS * ISO_SCALE,
    OY + ((rx + ry) * ISO_SIN - wz) * ISO_SCALE,
  ];
}

// Rotate a direction vector around the Y axis
function rotY(v, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [v[0]*c + v[2]*s, v[1], -v[0]*s + v[2]*c];
}
// Rotate a direction vector around the X axis
function rotX(v, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [v[0], v[1]*c - v[2]*s, v[1]*s + v[2]*c];
}
// Rotate a direction vector around the Z axis (vertical shaft — horizontal sweep)
function rotZ(v, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [v[0]*c - v[1]*s, v[0]*s + v[1]*c, v[2]];
}

// Transform a body-frame offset to world space, applying body pitch and roll.
// Body frame: X=right, Y=back, Z=up, origin at BDY centre.
function bodyToWorld(bx, by, bz) {
  const v = rotX(rotY([bx, by, bz], state.pitch), state.roll);
  return [BDY.cx + v[0], BDY.cy + v[1], BDY.cz + v[2]];
}

// Fit a plane to an array of [x,y,z] points; return the upward unit normal.
function fitPlane(pts) {
  if (pts.length < 3) return [0, 0, 1];
  const c = pts.reduce((a, p) => [a[0]+p[0], a[1]+p[1], a[2]+p[2]], [0,0,0])
               .map(v => v / pts.length);
  let n = [0, 0, 0];
  for (let i = 0; i < pts.length; i++) {
    const j = (i + 1) % pts.length;
    const v1 = pts[i].map((v, k) => v - c[k]);
    const v2 = pts[j].map((v, k) => v - c[k]);
    n[0] += v1[1]*v2[2] - v1[2]*v2[1];
    n[1] += v1[2]*v2[0] - v1[0]*v2[2];
    n[2] += v1[0]*v2[1] - v1[1]*v2[0];
  }
  const len = Math.sqrt(n[0]*n[0] + n[1]*n[1] + n[2]*n[2]);
  if (len < 0.001) return [0, 0, 1];
  const sign = n[2] < 0 ? -1 : 1;
  return n.map(v => v * sign / len);
}

// ── Robot geometry (mm) ──────────────────────────────────────────────────────
// Body centre in world space. Height auto-solves in drawRobot(); 66 = Stand target.
const BDY = { cx:0, cy:0, cz:66, w:58, d:86, h:20 };

// Neutral hip direction at servo=90°: purely horizontal outward.
// Hip shafts point UP (Z axis) — they sweep in the horizontal X-Y plane.
const N0  = [1, 0, 0];   // right-side neutral
const N0L = [-1, 0, 0];  // left-side neutral

// Segment lengths from STL analysis (same pieces all legs):
//   hip arm (R1/L1/R2/L2 → R3/L3/R4/L4 pivot): 49.5 mm → 50
//   lower leg (knee pivot → foot tip):            58.4 mm → 58
const UPP = 50;  // hip arm length (mm)
const LOW = 58;  // lower leg length (mm)

// Leg topology (from top-down image, FRONT = +Y):
//   FR = R1 (hip, Z-axis) + R3 (knee, vertical-plane)
//   FL = L1 (hip, Z-axis) + L3 (knee, vertical-plane)
//   BR = R2 (hip, Z-axis) + R4 (knee, vertical-plane)
//   BL = L2 (hip, Z-axis) + L4 (knee, vertical-plane)
//
// kneeFn returns the physical angle from straight-down (0=down, π/2=horizontal).
// Polarity differs per leg due to servo installation orientation:
//   R3 & L4: servo 180 = down → physAngle = (180−v)·π/180
//   L3 & R4: servo   0 = down → physAngle = v·π/180
const LEGS = [
  { name:'FR', hs:'R1', ks:'R3', mount:[ 28, 42, -8], dir0: N0,  upp: UPP, low: LOW,
    hipFn:  v => (v - 90) * (Math.PI/180),
    kneeFn: v => (180 - v) * (Math.PI/180),
    kneeInv: true  },   // R3: servo 180 = straight down
  { name:'FL', hs:'L1', ks:'L3', mount:[-28, 42, -8], dir0: N0L, upp: UPP, low: LOW,
    hipFn:  v => (v - 90) * (Math.PI/180),
    kneeFn: v => v * (Math.PI/180),
    kneeInv: false },   // L3: servo   0 = straight down
  { name:'BR', hs:'R2', ks:'R4', mount:[ 28,-42, -8], dir0: N0,  upp: UPP, low: LOW,
    hipFn:  v => (v - 90) * (Math.PI/180),
    kneeFn: v => v * (Math.PI/180),
    kneeInv: false },   // R4: servo   0 = straight down
  { name:'BL', hs:'L2', ks:'L4', mount:[-28,-42, -8], dir0: N0L, upp: UPP, low: LOW,
    hipFn:  v => (v - 90) * (Math.PI/180),
    kneeFn: v => (180 - v) * (Math.PI/180),
    kneeInv: true  },   // L4: servo 180 = straight down
];

function computeLeg(leg) {
  const hv = state.servos[leg.hs], kv = state.servos[leg.ks];
  const hipA = leg.hipFn(hv);
  const physAngle = leg.kneeFn(kv);  // angle from straight-down (0=down, π/2=horizontal)

  // Hip: rotZ sweeps upper arm in horizontal X-Y plane (shaft points up).
  // Knee: lower leg direction = outward·sin(physAngle) + down·cos(physAngle)
  const [mx, my, mz] = leg.mount;
  const ud = rotZ(leg.dir0, hipA);                        // upper arm direction (always horizontal)
  const kbx = mx + ud[0]*leg.upp, kby = my + ud[1]*leg.upp, kbz = mz;  // knee at same Z as mount
  const sp = Math.sin(physAngle), cp = Math.cos(physAngle);
  const ld = [ud[0]*sp, ud[1]*sp, -cp];                  // lower arm direction
  const fbx = kbx + ld[0]*leg.low, fby = kby + ld[1]*leg.low, fbz = kbz + ld[2]*leg.low;

  const hip  = bodyToWorld(mx, my, mz);
  const knee = bodyToWorld(kbx, kby, kbz);
  const foot = bodyToWorld(fbx, fby, fbz);

  return { hip, knee, foot, grounded: foot[2] <= 8 };
}

// ─────────────────────────────────────────────────────────────────────────────
// INVERSE KINEMATICS
// ─────────────────────────────────────────────────────────────────────────────
// Given a foot target (fx,fy,fz) expressed in body frame RELATIVE to the leg's
// hip mount point, compute the two servo values.
//
// Math:
//   θ1 (hip yaw) = atan2(fy,fx) − neutral_direction_angle
//   r  = sqrt(fx²+fy²)          horizontal reach to foot
//   rk = r − UPP                horizontal reach from KNEE to foot
//   physAngle = atan2(rk, −fz)  knee pitch (0=down, π/2=horizontal)
//   kneeServo = 180−physAngle° if kneeInv, else physAngle°
function ikLeg(leg, fx, fy, fz) {
  const targetA  = Math.atan2(fy, fx);
  const neutralA = Math.atan2(leg.dir0[1], leg.dir0[0]);
  // Normalise to [-π, π] to avoid wrap-around at the ±180° boundary
  let hipA = targetA - neutralA;
  while (hipA >  Math.PI) hipA -= 2 * Math.PI;
  while (hipA < -Math.PI) hipA += 2 * Math.PI;

  const r   = Math.sqrt(fx*fx + fy*fy);
  let rk    = r - leg.upp;
  let dz    = fz; // negative = below hip

  // Clamp foot to reachable sphere (radius = lower-leg length minus 1 mm margin)
  const maxR = leg.low - 1;
  const dist = Math.sqrt(rk*rk + dz*dz);
  if (dist > maxR) { const s = maxR / dist; rk *= s; dz *= s; }
  if (dist < 4)    { dz = -4; rk = 0; } // prevent gimbal at full retraction

  const physAngle = Math.atan2(Math.max(0, rk), -dz);
  const paDeg = physAngle * (180 / Math.PI);

  const hipDeg   = Math.max(0, Math.min(180, hipA * (180 / Math.PI) + 90));
  const kneeDeg  = Math.max(0, Math.min(180, leg.kneeInv ? 180 - paDeg : paDeg));
  return { hipDeg, kneeDeg };
}

// Apply IK result to state.servos and update DOM sliders for one leg
function applyIKLeg(leg, fx, fy, fz) {
  const { hipDeg, kneeDeg } = ikLeg(leg, fx, fy, fz);
  const vals = { [leg.hs]: hipDeg, [leg.ks]: kneeDeg };
  Object.entries(vals).forEach(([n, v]) => {
    state.servos[n] = v;
    const sl = document.getElementById('sv-' + n);
    const vl = document.getElementById('sv-val-' + n);
    if (sl) sl.value = v;
    if (vl) vl.textContent = Math.round(v) + '°';
  });
}

// ── Drawing helpers ──────────────────────────────────────────────────────────
function line(p1, p2, col, w) {
  RCTX.strokeStyle = col; RCTX.lineWidth = w; RCTX.lineCap = 'round';
  RCTX.beginPath(); RCTX.moveTo(...p1); RCTX.lineTo(...p2); RCTX.stroke();
}

function circle(p, r, fill, stroke, sw) {
  RCTX.beginPath(); RCTX.arc(p[0], p[1], r, 0, 6.2832);
  if (fill)  { RCTX.fillStyle   = fill;   RCTX.fill(); }
  if (stroke){ RCTX.strokeStyle = stroke; RCTX.lineWidth = sw||1.5; RCTX.stroke(); }
}

function poly(pts, fill, stroke, sw) {
  RCTX.beginPath(); RCTX.moveTo(...pts[0]);
  for (let i=1;i<pts.length;i++) RCTX.lineTo(...pts[i]);
  RCTX.closePath();
  if (fill)  { RCTX.fillStyle   = fill;   RCTX.fill(); }
  if (stroke){ RCTX.strokeStyle = stroke; RCTX.lineWidth = sw||1; RCTX.stroke(); }
}

// Draw a circle lying flat on the floor plane (Z=0) centred at world (wx,wy).
// Projects N sample points through iso() to get the correct isometric ellipse.
function isoFloorCircle(wx, wy, r, fill, stroke, sw, N=32) {
  RCTX.beginPath();
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * Math.PI * 2;
    const [sx, sy] = iso(wx + r * Math.cos(a), wy + r * Math.sin(a), 0);
    i === 0 ? RCTX.moveTo(sx, sy) : RCTX.lineTo(sx, sy);
  }
  RCTX.closePath();
  if (fill)  { RCTX.fillStyle   = fill;   RCTX.fill(); }
  if (stroke){ RCTX.strokeStyle = stroke; RCTX.lineWidth = sw||1; RCTX.stroke(); }
}

// ── Main draw function ───────────────────────────────────────────────────────
function drawRobot() {
  RCTX.clearRect(0, 0, CW, CH);

  // ── background ──────────────────────────────────────────────────────────
  RCTX.fillStyle = '#080810';
  RCTX.fillRect(0, 0, CW, CH);

  // Compute world-space leg geometry for drawing.
  const legs = LEGS.map(computeLeg);

  // ── floor ───────────────────────────────────────────────────────────────
  const GS = 22, GR = 110; // grid spacing, grid radius (world mm)

  // Snap grid origin to camera so the grid tiles seamlessly as the body walks
  const gx0 = Math.floor((cam.x - GR) / GS) * GS;
  const gx1 = Math.ceil ((cam.x + GR) / GS) * GS;
  const gy0 = Math.floor((cam.y - GR) / GS) * GS;
  const gy1 = Math.ceil ((cam.y + GR) / GS) * GS;
  const fc = [iso(gx0,gy0,0), iso(gx1,gy0,0), iso(gx1,gy1,0), iso(gx0,gy1,0)];
  poly(fc, '#080f08');

  RCTX.globalAlpha = 0.55;
  for (let v = gy0; v <= gy1; v += GS)
    line(iso(gx0, v, 0), iso(gx1, v, 0), '#1a2e1a', 0.7);
  for (let v = gx0; v <= gx1; v += GS)
    line(iso(v, gy0, 0), iso(v, gy1, 0), '#1a2e1a', 0.7);
  RCTX.globalAlpha = 1;
  poly(fc, null, '#1e321e', 1.2);

  // ── floor contact ellipses ───────────────────────────────────────────────
  legs.forEach(leg => {
    const [fx, fy, fz] = leg.foot;
    if (leg.grounded) {
      // Outer glow ring
      RCTX.globalAlpha = 0.15;
      isoFloorCircle(fx, fy, 14, '#ff8c42');
      // Contact ring
      RCTX.globalAlpha = 0.7;
      isoFloorCircle(fx, fy, 8, null, '#ff8c42', 1);
      RCTX.globalAlpha = 1;
      // Vertical drop line from foot to floor
      const fp = iso(fx, fy, Math.max(fz, 0));
      const sp = iso(fx, fy, 0);
      if (fz > 1) line(fp, sp, 'rgba(255,140,66,0.3)', 1);
    } else {
      // Faint shadow blob shrinks as foot rises
      const alpha = Math.max(0, 0.2 - fz * 0.002);
      RCTX.globalAlpha = alpha;
      isoFloorCircle(fx, fy, 6, '#8888aa');
      RCTX.globalAlpha = 1;
    }
  });

  // ── all legs (back behind body, front in front) ──────────────────────────
  [3, 2].forEach(i => _drawLeg(legs[i], LEGS[i].name, true));

  // ── body box wireframe (corners in body frame → world via bodyToWorld) ────
  const {w, d, h} = BDY;
  const bw = p => iso(...bodyToWorld(...p));
  const C = [
    bw([-w/2, -d/2, -h/2]), bw([w/2, -d/2, -h/2]),  // 0,1 bottom-front
    bw([ w/2,  d/2, -h/2]), bw([-w/2,  d/2, -h/2]),  // 2,3 bottom-back
    bw([-w/2, -d/2,  h/2]), bw([w/2, -d/2,  h/2]),   // 4,5 top-front
    bw([ w/2,  d/2,  h/2]), bw([-w/2,  d/2,  h/2]),  // 6,7 top-back
  ];
  const EDGES = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  EDGES.forEach(([a,b]) => line(C[a], C[b], '#ff8c42', 1));

  // "FRONT" / "BACK" labels
  RCTX.font = 'bold 8px monospace';
  RCTX.textAlign = 'center';
  const frontMid = iso(...bodyToWorld(0, +d/2, 0));
  RCTX.fillStyle = 'rgba(255,140,66,0.6)';
  RCTX.fillText('FRONT', frontMid[0], frontMid[1]+3);
  const backMid  = iso(...bodyToWorld(0, -d/2, 0));
  RCTX.fillStyle = 'rgba(255,140,66,0.35)';
  RCTX.fillText('BACK', backMid[0], backMid[1]+3);

  [1, 0].forEach(i => _drawLeg(legs[i], LEGS[i].name, false));

  // ── firmware walk overlays ───────────────────────────────────────────────
  if (FW.active && FW.footW) {
    // Support polygon from stance feet
    const fwPts = FW.footW.map((fw, i) => FW.stance[i] ? iso(fw[0], fw[1], 0) : null).filter(Boolean);
    if (fwPts.length >= 3) {
      RCTX.beginPath(); RCTX.moveTo(...fwPts[0]);
      fwPts.slice(1).forEach(p => RCTX.lineTo(...p));
      RCTX.closePath();
      RCTX.fillStyle = 'rgba(80,160,255,0.07)'; RCTX.fill();
      RCTX.strokeStyle = 'rgba(80,160,255,0.3)'; RCTX.lineWidth = 1; RCTX.stroke();
    }
    // Contact point markers (filled circle = on ground, open = swing)
    FW.footW.forEach((fw, i) => {
      const p = iso(fw[0], fw[1], 0);
      RCTX.beginPath(); RCTX.arc(p[0], p[1], 4, 0, 6.2832);
      if (FW.stance[i]) {
        RCTX.fillStyle = 'rgba(80,200,255,0.8)'; RCTX.fill();
      } else {
        RCTX.strokeStyle = 'rgba(80,200,255,0.4)'; RCTX.lineWidth = 1.5; RCTX.stroke();
      }
    });
    // Body path dot
    const bp = iso(FW.bodyX, FW.bodyY, 0);
    RCTX.strokeStyle = 'rgba(255,220,0,0.8)'; RCTX.lineWidth = 1.5;
    RCTX.beginPath(); RCTX.arc(bp[0], bp[1], 4, 0, 6.2832); RCTX.stroke();
    // HUD
    const stNames = LEGS.filter((_, i) => FW.stance[i]).map(l => l.name).join('+') || '—';
    RCTX.font = '9px monospace'; RCTX.textAlign = 'left';
    RCTX.fillStyle = 'rgba(80,200,255,0.85)';
    RCTX.fillText(`WALK  frame:${FW.frameIdx}  stance:${stNames}  +${Math.round(FW.bodyY)}mm`, 10, 14);
  }

  // ── creep gait overlays ──────────────────────────────────────────────────
  if (CG.active && CG.footW) {
    // Support polygon (stance feet only)
    const sPts = CG.footW
      .map((fw, i) => (i === CG.swingLeg) ? null : iso(fw[0], fw[1], 0))
      .filter(Boolean);
    if (sPts.length >= 3) {
      RCTX.beginPath(); RCTX.moveTo(...sPts[0]);
      sPts.slice(1).forEach(p => RCTX.lineTo(...p));
      RCTX.closePath();
      RCTX.fillStyle   = 'rgba(0,180,80,0.07)';  RCTX.fill();
      RCTX.strokeStyle = 'rgba(0,180,80,0.28)';  RCTX.lineWidth = 1;  RCTX.stroke();
    }

    // Stance foot targets (× markers on floor)
    CG.footW.forEach((fw, i) => {
      if (i === CG.swingLeg) return;
      const p = iso(fw[0], fw[1], 0); const s = 4;
      RCTX.strokeStyle = 'rgba(0,200,100,0.45)'; RCTX.lineWidth = 1;
      RCTX.beginPath();
      RCTX.moveTo(p[0]-s,p[1]-s); RCTX.lineTo(p[0]+s,p[1]+s);
      RCTX.moveTo(p[0]+s,p[1]-s); RCTX.lineTo(p[0]-s,p[1]+s);
      RCTX.stroke();
    });

    // Swing-foot landing target (orange circle)
    if (CG.swingLeg >= 0) {
      const tp = iso(CG.swingTo[0], CG.swingTo[1], 0);
      RCTX.strokeStyle = 'rgba(255,140,66,0.7)'; RCTX.lineWidth = 1.5;
      RCTX.beginPath(); RCTX.arc(tp[0], tp[1], 5, 0, 6.2832); RCTX.stroke();
    }

    // CoM projection (yellow crosshair)
    const comP = iso(CG.bodyX, CG.bodyY, 0);
    RCTX.strokeStyle = 'rgba(255,220,0,0.75)'; RCTX.lineWidth = 1.5;
    RCTX.beginPath(); RCTX.arc(comP[0], comP[1], 4, 0, 6.2832); RCTX.stroke();
    RCTX.strokeStyle = 'rgba(255,220,0,0.35)'; RCTX.lineWidth = 1;
    RCTX.beginPath();
    RCTX.moveTo(comP[0]-9,comP[1]); RCTX.lineTo(comP[0]+9,comP[1]);
    RCTX.moveTo(comP[0],comP[1]-9); RCTX.lineTo(comP[0],comP[1]+9);
    RCTX.stroke();

    // HUD: phase + swing leg name
    const swName = CG.swingLeg >= 0 ? LEGS[CG.swingLeg].name : '—';
    RCTX.font = '9px monospace'; RCTX.textAlign = 'left';
    RCTX.fillStyle = 'rgba(0,200,100,0.85)';
    RCTX.fillText(`CREEP  ${CG.phase}  swing:${swName}  +${Math.round(CG.bodyY)}mm`, 10, 14);
  }

  // ── gravity / contact overlay (static poses only) ────────────────────────
  if (!FW.active && !CG.active) {
    const stance  = detectStance();
    const fbodies = currentFootBodies();

    // Contact points: filled = on floor, open ring = in air
    LEGS.forEach((leg, i) => {
      const fb = fbodies[i];
      const wp = bodyToWorld(fb[0], fb[1], fb[2]);
      const p  = iso(wp[0], wp[1], wp[2]);
      RCTX.beginPath(); RCTX.arc(p[0], p[1], 4, 0, 6.2832);
      if (stance[i]) {
        RCTX.fillStyle = 'rgba(80,200,255,0.85)'; RCTX.fill();
      } else {
        RCTX.strokeStyle = 'rgba(80,200,255,0.4)'; RCTX.lineWidth = 1.5; RCTX.stroke();
      }
    });

    // Support polygon on the floor
    const sPts = LEGS.map((_, i) => stance[i] ? iso(BDY.cx + fbodies[i][0], BDY.cy + fbodies[i][1], 0) : null).filter(Boolean);
    if (sPts.length >= 2) {
      RCTX.beginPath(); RCTX.moveTo(...sPts[0]);
      sPts.slice(1).forEach(p => RCTX.lineTo(...p));
      if (sPts.length >= 3) RCTX.closePath();
      RCTX.strokeStyle = 'rgba(80,200,255,0.35)'; RCTX.lineWidth = 1; RCTX.stroke();
      if (sPts.length >= 3) { RCTX.fillStyle = 'rgba(80,200,255,0.06)'; RCTX.fill(); }
    }

    // CoM floor projection (yellow dot)
    const com = iso(BDY.cx, BDY.cy, 0);
    RCTX.strokeStyle = 'rgba(255,220,0,0.8)'; RCTX.lineWidth = 1.5;
    RCTX.beginPath(); RCTX.arc(com[0], com[1], 4, 0, 6.2832); RCTX.stroke();
    RCTX.beginPath(); RCTX.moveTo(com[0]-8, com[1]); RCTX.lineTo(com[0]+8, com[1]);
    RCTX.moveTo(com[0], com[1]-8); RCTX.lineTo(com[0], com[1]+8); RCTX.stroke();

    // HUD: gravity state
    const stNames = LEGS.filter((_, i) => stance[i]).map(l => l.name).join('+') || 'none';
    const pitchDeg = (state.pitch * 180 / Math.PI).toFixed(1);
    const rollDeg  = (state.roll  * 180 / Math.PI).toFixed(1);
    RCTX.font = '9px monospace'; RCTX.textAlign = 'left';
    RCTX.fillStyle = 'rgba(80,200,255,0.85)';
    RCTX.fillText(`GRAV  stance:${stNames}  cz:${Math.round(BDY.cz)}  pitch:${pitchDeg}°  roll:${rollDeg}°`, 10, 14);
  }

  // ── axes legend (small, bottom-right corner) ─────────────────────────────
  _drawAxes();
}

function _drawLeg(leg, name, isBack) {
  const hip  = iso(...leg.hip);
  const knee = iso(...leg.knee);
  const foot = iso(...leg.foot);

  const alpha = isBack ? 0.5 : 1.0;
  const col   = isBack ? '#cc7030' : '#ff8c42';
  RCTX.globalAlpha = alpha;

  line(hip, knee, col, 1);
  line(knee, foot, col, 1);

  // Joint dots
  circle(hip,  2.5, col);
  circle(knee, 2,   col);
  if (leg.grounded) {
    circle(foot, 3, null, col, 1);
  } else {
    circle(foot, 2, col);
  }

  // Label near foot
  const [,,fz] = leg.foot;
  RCTX.font = '8px monospace';
  RCTX.textAlign = 'center';
  RCTX.fillStyle = col;
  RCTX.fillText(name, foot[0], foot[1] + (fz > 20 ? -10 : 10));

  RCTX.globalAlpha = 1;
}

function _drawAxes() {
  // Small axis indicator bottom-right
  const ax = CW - 46, ay = CH - 34;
  const len = 18;
  const o = [ax, ay];
  const xEnd = iso(len, 0, 0), yEnd = iso(0, len, 0), zEnd = iso(0, 0, len);
  // Compute offsets from world origin
  const orig = iso(0,0,0);
  const dx = xEnd[0]-orig[0], dy_x = xEnd[1]-orig[1];
  const dx2 = yEnd[0]-orig[0], dy2 = yEnd[1]-orig[1];
  const dx3 = zEnd[0]-orig[0], dy3 = zEnd[1]-orig[1];

  RCTX.globalAlpha = 0.55;
  line([ax, ay], [ax+dx, ay+dy_x], '#e05030', 1.5);   // X → right
  line([ax, ay], [ax+dx2,ay+dy2],  '#30a050', 1.5);   // Y → forward
  line([ax, ay], [ax+dx3,ay+dy3],  '#4080e0', 1.5);   // Z → up
  RCTX.font = '8px monospace'; RCTX.textAlign = 'left';
  RCTX.fillStyle = '#e05030'; RCTX.fillText('X', ax+dx+2,  ay+dy_x+4);
  RCTX.fillStyle = '#30a050'; RCTX.fillText('Y', ax+dx2+2, ay+dy2+4);
  RCTX.fillStyle = '#4080e0'; RCTX.fillText('Z', ax+dx3+2, ay+dy3+4);
  RCTX.globalAlpha = 1;
}

const SERVO_ORDER  = ['R1','R3','L1','L3','R2','R4','L2','L4'];
const SERVO_GROUPS = {
  R1:'FR hip', R3:'FR knee', L1:'FL hip', L3:'FL knee',
  R2:'BR hip', R4:'BR knee', L2:'BL hip', L4:'BL knee',
};

function buildServoPanel() {
  const el = document.getElementById('servo-panel');
  SERVO_ORDER.forEach(n => {
    const row = document.createElement('div');
    row.className = 'servo-row';
    row.innerHTML = `
      <span class="sname" title="${SERVO_GROUPS[n]}">${n}</span>
      <input class="sslider" type="range" min="0" max="180" value="${state.servos[n]}"
             id="sv-${n}" data-s="${n}">
      <span class="sval" id="sv-val-${n}">${state.servos[n]}°</span>`;
    el.appendChild(row);
  });
  el.addEventListener('input', e => {
    if (!e.target.classList.contains('sslider')) return;
    stopAnim();
    setServo(e.target.dataset.s, +e.target.value);
  });
}

function setServo(n, v) {
  if (Math.abs(state.servos[n] - v) > 0.5 && SERVO_LEG[n] !== undefined)
    state.legChanged[SERVO_LEG[n]] = state.frame;
  state.servos[n] = v;
  const sl = document.getElementById('sv-'+n), vl = document.getElementById('sv-val-'+n);
  if (sl) sl.value = v;
  if (vl) vl.textContent = Math.round(v) + '°';
  drawRobot();
}

// Smooth servo transition: lerp from current values to targets over `ms` milliseconds
function setServos(obj, ms) {
  if (!obj) return;
  if (!ms || ms <= 0) { Object.entries(obj).forEach(([k,v]) => setServo(k, v)); return; }

  const from = {};
  const to   = {};
  Object.entries(obj).forEach(([k,v]) => { from[k] = state.servos[k]; to[k] = v; });

  const start = performance.now();
  function tick(now) {
    const t = Math.min((now - start) / ms, 1);
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t; // ease-in-out quad
    Object.entries(to).forEach(([k,v]) => {
      const cur = from[k] + (v - from[k]) * ease;
      state.servos[k] = cur;
      const sl = document.getElementById('sv-'+k), vl = document.getElementById('sv-val-'+k);
      if (sl) sl.value = cur;
      if (vl) vl.textContent = Math.round(cur) + '°';
    });
    drawRobot();
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ─────────────────────────────────────────────────────────────────────────────
// ANIMATION PLAYER
// ─────────────────────────────────────────────────────────────────────────────
function stopAnim() {
  clearTimeout(state.animTimer);
  state.animTimer = null; state.animName = null;
  document.querySelectorAll('.cmd-btn.active').forEach(b => b.classList.remove('active'));
}

function playAnim(name) {
  stopAnim();
  const seq = ANIMATIONS[name];
  if (!seq) return;
  state.animName = name;
  state.animStepIdx = 0;
  document.querySelectorAll(`.cmd-btn[data-cmd="${name}"]`).forEach(b => b.classList.add('active'));
  clearLog();
  runStep(seq);
}

function runStep(seq) {
  if (state.animStepIdx >= seq.length) { stopAnim(); logLine('✓ done'); return; }
  const step = seq[state.animStepIdx++];
  logLine(`${state.animStepIdx}. ${descStep(step)}`);
  if (step.face) setFace(step.face, step.mode || 'loop');
  const transMs = (step.delay || 0) / state.speed;
  if (step.servos) {
    // Solve gravity from TARGET servo values before interpolation starts,
    // so the body pose is physically correct throughout the transition.
    if (!FW.active && !CG.active) {
      const merged = { ...state.servos, ...step.servos };
      const stanceFlags = LEGS.map(leg => leg.kneeFn(merged[leg.ks]) < 0.18);
      const footBodies  = LEGS.map(leg => {
        const hipA = leg.hipFn(merged[leg.hs]);
        const physA = leg.kneeFn(merged[leg.ks]);
        const [mx, my, mz] = leg.mount;
        const ud = rotZ(leg.dir0, hipA);
        const sp = Math.sin(physA), cp = Math.cos(physA);
        return [mx+ud[0]*(leg.upp+sp*leg.low), my+ud[1]*(leg.upp+sp*leg.low), mz-cp*leg.low];
      });
      const { cz, pitch, roll } = solveBodyGravity(footBodies, stanceFlags);
      BDY.cz = cz; state.pitch = pitch; state.roll = roll;
    }
    setServos(step.servos, transMs * 0.9);
  }
  const ms = (step.delay || 0) / state.speed;
  if (ms > 0) state.animTimer = setTimeout(() => { runStep(seq); }, ms);
  else runStep(seq);
}

function descStep(s) {
  const p = [];
  if (s.face)   p.push('face:' + s.face);
  if (s.servos) p.push(Object.entries(s.servos).map(([k,v])=>`${k}=${v}`).join(' '));
  if (s.delay)  p.push(`${s.delay}ms`);
  return p.join('  ') || '—';
}

// ─────────────────────────────────────────────────────────────────────────────
// FIRMWARE WALK PLAYBACK
// ─────────────────────────────────────────────────────────────────────────────
// Replays the exact servo angle keyframes from firmware runWalkPose().
// Body (X,Y) is derived each frame from stance-foot FK constraints — no assumed
// velocity. This reveals the actual contact points and body motion path.
//
// Leg mapping: 0=FR, 1=FL, 2=BR, 3=BL
//   FR: hip=R1, knee=R3   FL: hip=L1, knee=L3
//   BR: hip=R2, knee=R4   BL: hip=L2, knee=L4
//
// Firmware walk cycle — one pressingCheck call per keyframe (WD=100ms each):
//   Frame 0  (initial)  : R3=135,L3=45, R2=100,L1=25  (both front knees lift)
//   Frame 1  (step 1)   : L3=0                          (FL sets down)
//   Frame 2  (step 2)   : L4=135,L2=90, R4=0, R1=180   (BL lifts, FR hip fwd)
//   Frame 3  (step 3)   : R2=45, L1=90                  (weight shift)
//   Frame 4  (step 4)   : R4=45, L4=180                 (BR lifts, BL sets)
//   Frame 5  (step 5)   : R3=180,L3=45, R2=90, L1=0    (FR sets, FL lifts)
//   Frame 6  (step 6)   : L2=135,R1=90                  (BL hip back, FR hip back)
//   → repeat frames 1–6

const FW_FRAMES = [
  // Frame 0: initial (from STAND, changes: R3=135,L3=45,R2=100,L1=25)
  {R1:135, R2:100, L1:25,  L2:135, R3:135, R4:0,  L3:45, L4:180},
  // Frame 1: step 1 — L3=0
  {R1:135, R2:100, L1:25,  L2:135, R3:135, R4:0,  L3:0,  L4:180},
  // Frame 2: step 2 — L4=135,L2=90,R4=0,R1=180
  {R1:180, R2:100, L1:25,  L2:90,  R3:135, R4:0,  L3:0,  L4:135},
  // Frame 3: step 3 — R2=45,L1=90
  {R1:180, R2:45,  L1:90,  L2:90,  R3:135, R4:0,  L3:0,  L4:135},
  // Frame 4: step 4 — R4=45,L4=180
  {R1:180, R2:45,  L1:90,  L2:90,  R3:135, R4:45, L3:0,  L4:180},
  // Frame 5: step 5 — R3=180,L3=45,R2=90,L1=0
  {R1:180, R2:90,  L1:0,   L2:90,  R3:180, R4:45, L3:45, L4:180},
  // Frame 6: step 6 — L2=135,R1=90
  {R1:90,  R2:90,  L1:0,   L2:135, R3:180, R4:45, L3:45, L4:180},
];
const FW_LOOP_START = 1; // after frame 0, loop frames 1–6

const FW = {
  active: false,
  frameIdx: 0,
  frameT: 0,       // 0→1 progress through current frame
  bodyX: 0, bodyY: 0,
  footW: null,     // world foot positions [4]×[x,y,z]
  stance: [false, false, false, false],
  raf: null,
  lastTS: 0,
};

// Foot position in body frame for given servo map (independent of state.servos)
function fwFootBody(legIdx, servos) {
  const leg = LEGS[legIdx];
  const hipA = leg.hipFn(servos[leg.hs]);
  const physAngle = leg.kneeFn(servos[leg.ks]);
  const [mx, my, mz] = leg.mount;
  const ud = rotZ(leg.dir0, hipA);
  const sp = Math.sin(physAngle), cp = Math.cos(physAngle);
  return [
    mx + ud[0] * (leg.upp + sp * leg.low),
    my + ud[1] * (leg.upp + sp * leg.low),
    mz - cp * leg.low,
  ];
}

// Leg is in stance when physAngle is near 0 (foot pointing straight down)
function fwIsStance(legIdx, servos) {
  return LEGS[legIdx].kneeFn(servos[LEGS[legIdx].ks]) < 0.18; // < ~10°
}

function fwLerp(a, b, t) {
  const o = {};
  for (const k of Object.keys(a)) o[k] = a[k] + (b[k] - a[k]) * t;
  return o;
}

function fwNextIdx(idx) {
  if (idx === 0) return FW_LOOP_START;
  const span = FW_FRAMES.length - FW_LOOP_START;
  return FW_LOOP_START + (idx - FW_LOOP_START + 1) % span;
}

// Detect stance for current state.servos (knee physAngle < threshold = on ground)
function detectStance() {
  return LEGS.map(leg => leg.kneeFn(state.servos[leg.ks]) < 0.18);
}

// Compute foot body-frame positions from current state.servos (flat-body approx)
function currentFootBodies() {
  return LEGS.map((leg, i) => {
    const hipA = leg.hipFn(state.servos[leg.hs]);
    const physA = leg.kneeFn(state.servos[leg.ks]);
    const [mx, my, mz] = leg.mount;
    const ud = rotZ(leg.dir0, hipA);
    const sp = Math.sin(physA), cp = Math.cos(physA);
    return [mx + ud[0]*(leg.upp + sp*leg.low),
            my + ud[1]*(leg.upp + sp*leg.low),
            mz - cp*leg.low];
  });
}

// Apply gravity physics to a static pose: solves body Z/pitch/roll so stance
// feet sit on the floor (Z=0). Call after updating state.servos for any pose.
function applyGravityPose() {
  if (FW.active || CG.active) return; // gaits manage their own body pose
  const stance = detectStance();
  const footBodies = currentFootBodies();
  const { cz, pitch, roll } = solveBodyGravity(footBodies, stance);
  BDY.cz      = cz;
  state.pitch = pitch;
  state.roll  = roll;
}

function fwApplyServos(servos) {
  for (const [k, v] of Object.entries(servos)) {
    state.servos[k] = v;
    const sl = document.getElementById('sv-' + k);
    const vl = document.getElementById('sv-val-' + k);
    if (sl) sl.value = v;
    if (vl) vl.textContent = Math.round(v) + '°';
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// GRAVITY PHYSICS SOLVER
// ─────────────────────────────────────────────────────────────────────────────
// Given foot positions in body frame (from FK) and which feet are in stance,
// computes the body's Z height, pitch, and roll so that all stance feet
// exactly touch the floor (world Z = 0).
//
// The constraint for each stance foot (linearised for small angles):
//   BDY.cz + foot_bz − pitch × foot_bx + roll × foot_by = 0
//
// → overdetermined with 3+ feet (least-squares), underdetermined with <3
//   (Tikhonov regularisation: gravity resists tilt, body prefers upright).

function _solve3x3(A, b) {
  // Gaussian elimination with partial pivoting on augmented [A|b]
  const M = A.map((r, i) => [...r, b[i]]);
  for (let c = 0; c < 3; c++) {
    let mx = c;
    for (let r = c + 1; r < 3; r++) if (Math.abs(M[r][c]) > Math.abs(M[mx][c])) mx = r;
    [M[c], M[mx]] = [M[mx], M[c]];
    if (Math.abs(M[c][c]) < 1e-12) continue;
    for (let r = c + 1; r < 3; r++) {
      const f = M[r][c] / M[c][c];
      for (let k = c; k <= 3; k++) M[r][k] -= f * M[c][k];
    }
  }
  const x = [0, 0, 0];
  for (let i = 2; i >= 0; i--) {
    x[i] = M[i][3];
    for (let j = i + 1; j < 3; j++) x[i] -= M[i][j] * x[j];
    x[i] /= M[i][i] || 1;
  }
  return x; // [cz, pitch_rad, roll_rad]
}

// Solve a single set of foot contacts (least-squares, tiny stabilisation)
function _solveContact(footBodies, active) {
  const AtA = [[0,0,0],[0,0,0],[0,0,0]];
  const Atb = [0,0,0];
  for (const i of active) {
    const [bx, by, bz] = footBodies[i];
    const row = [1, -bx, by]; const rhs = -bz;
    for (let j = 0; j < 3; j++) {
      Atb[j] += row[j] * rhs;
      for (let k = 0; k < 3; k++) AtA[j][k] += row[j] * row[k];
    }
  }
  AtA[0][0] += 1e-6; AtA[1][1] += 1e-6; AtA[2][2] += 1e-6;
  return _solve3x3(AtA, Atb);
}

// Gravity physics: find the minimum-cz body pose (lowest = gravity wins) where
// no foot penetrates the floor.  Stance feet (knee down) MUST be on the floor;
// swing feet MAY touch the floor if that lets the body descend further.
//
// Approach: enumerate all contact subsets that include the mandatory (stance) feet,
// solve each 3x3 constraint system, keep the valid solution with lowest cz.
function solveBodyGravity(footBodies, stanceFlags) {
  const mandatory = [0,1,2,3].filter(i =>  stanceFlags[i]);
  const optional  = [0,1,2,3].filter(i => !stanceFlags[i]);

  let bestCz = Infinity, bestPitch = 0, bestRoll = 0;

  // Try every subset of optional feet added to the mandatory set
  for (let mask = 0; mask < (1 << optional.length); mask++) {
    const active = [...mandatory];
    for (let b = 0; b < optional.length; b++) {
      if (mask & (1 << b)) active.push(optional[b]);
    }
    if (active.length < 3) continue; // need ≥3 contacts for a unique solution

    const [cz, pitch, roll] = _solveContact(footBodies, active);

    // Reject degenerate or out-of-range solutions
    if (cz < 5 || cz > 120) continue;
    if (Math.abs(pitch) > 0.6 || Math.abs(roll) > 0.6) continue;

    // All four feet must be at or above the floor (no penetration)
    let valid = true;
    for (let i = 0; i < 4; i++) {
      const [bx, by, bz] = footBodies[i];
      if (cz + bz - bx * pitch + by * roll < -2) { valid = false; break; }
    }

    if (valid && cz < bestCz) { bestCz = cz; bestPitch = pitch; bestRoll = roll; }
  }

  // Fallback: body rests on its lowest stance foot
  if (bestCz === Infinity && mandatory.length > 0) {
    const [bx, by, bz] = footBodies[mandatory[0]];
    return { cz: Math.max(10, -bz), pitch: 0, roll: 0 };
  }
  if (bestCz === Infinity) return { cz: 66, pitch: 0, roll: 0 };

  return { cz: bestCz, pitch: bestPitch, roll: bestRoll };
}

function fwTick(ts) {
  if (!FW.active) return;
  const dt = Math.min((ts - FW.lastTS) / 1000, 0.05);
  FW.lastTS = ts;

  FW.frameT += dt / (WD / 1000);

  // Advance keyframes (may skip >1 if dt is large)
  while (FW.frameT >= 1) {
    FW.frameT -= 1;
    FW.frameIdx = fwNextIdx(FW.frameIdx);
    const newS = FW_FRAMES[FW.frameIdx];
    // Detect stance transitions; plant newly-grounded feet
    for (let i = 0; i < 4; i++) {
      const now = fwIsStance(i, newS);
      if (now && !FW.stance[i]) {
        const fb = fwFootBody(i, newS);
        FW.footW[i] = [FW.bodyX + fb[0], FW.bodyY + fb[1], 0];
      }
      FW.stance[i] = now;
    }
  }

  // Interpolated servo state between current and next keyframe
  const cur = FW_FRAMES[FW.frameIdx];
  const nxt = FW_FRAMES[fwNextIdx(FW.frameIdx)];
  const servos = fwLerp(cur, nxt, FW.frameT);

  // Body XY from stance feet (FK inverse, flat-body approximation)
  let sx = 0, sy = 0, sc = 0;
  for (let i = 0; i < 4; i++) {
    if (FW.stance[i]) {
      const fb = fwFootBody(i, servos);
      sx += FW.footW[i][0] - fb[0];
      sy += FW.footW[i][1] - fb[1];
      sc++;
    }
  }
  if (sc > 0) { FW.bodyX = sx / sc; FW.bodyY = sy / sc; }

  fwApplyServos(servos);
  BDY.cx = FW.bodyX; BDY.cy = FW.bodyY;
  cam.x  = FW.bodyX; cam.y  = FW.bodyY;

  drawRobot();
  FW.raf = requestAnimationFrame(fwTick);
}

function startGait() {
  if (CG.active) stopCreep();
  if (state.animTimer) { clearTimeout(state.animTimer); state.animTimer = null; state.animName = null; }

  FW.bodyX = 0; FW.bodyY = 0;
  BDY.cx = 0; BDY.cy = 0;
  cam.x = 0; cam.y = 0;

  // Start from stand; record world foot positions from FK
  Object.entries(STAND).forEach(([k, v]) => { state.servos[k] = v; });
  FW.footW = LEGS.map((_, i) => {
    const fb = fwFootBody(i, STAND);
    return [fb[0], fb[1], 0]; // body at origin → world = body frame
  });
  FW.stance  = [true, true, true, true];
  FW.frameIdx = 0;
  FW.frameT   = 0;
  FW.active   = true;
  state.gait.active = true; // keep existing stop logic working

  setFace('walk', 'loop');
  const btn = document.getElementById('btn-walk');
  if (btn) { btn.textContent = '⏹ Stop Walk'; btn.classList.add('walk-active'); }
  FW.lastTS = performance.now();
  FW.raf = requestAnimationFrame(fwTick);
  logLine('🐾 firmware walk started');
}

function stopGait() {
  FW.active = false;
  state.gait.active = false;
  if (FW.raf) { cancelAnimationFrame(FW.raf); FW.raf = null; }
  const btn = document.getElementById('btn-walk');
  if (btn) { btn.textContent = '🐾 Walk'; btn.classList.remove('walk-active'); }
  setFace('stand', 'once');
  Object.entries(STAND).forEach(([k, v]) => {
    state.servos[k] = v;
    const sl = document.getElementById('sv-'+k);
    const vl = document.getElementById('sv-val-'+k);
    if (sl) sl.value = v;
    if (vl) vl.textContent = Math.round(v) + '°';
  });
  BDY.cx = 0; BDY.cy = 0; cam.x = 0; cam.y = 0;
  BDY.cz = 66; state.pitch = 0; state.roll = 0;
  drawRobot();
  logLine('⏹ walk stopped');
}

// ─────────────────────────────────────────────────────────────────────────────
// CREEP GAIT  (world-frame IK, one leg swings at a time, CoM shifting)
// ─────────────────────────────────────────────────────────────────────────────
//
// World frame: floor Z=0, body walks in +Y direction.
// The body centre (BDY.cx, BDY.cy) moves in world space; camera tracks it so
// the view stays centred. Feet are given fixed world-frame targets during stance;
// IK converts those targets to servo angles each frame.
//
// Gait cycle (4-beat creep, diagonally ordered for smooth CoM transfer):
//   leg order: FR(0) → BL(3) → FL(1) → BR(2) → repeat
//   phases per step: stance (body moves fwd) → com_shift (lateral body shift)
//                    → swing (parabolic foot trajectory) → back to stance
//
// CoM shift: before swinging a right leg shift body −X (left),
//            before swinging a left leg shift body +X (right).
// ─────────────────────────────────────────────────────────────────────────────
const CG_VELOCITY  = 20;    // mm/s forward body speed
const CG_STEP      = 36;    // mm stride (tuned so relY_after_land = 3×cadence − threshold)
const CG_HEIGHT    = 20;    // mm peak foot lift (parabolic arc)
const CG_SWING_DUR = 0.40;  // seconds per swing phase
const CG_COM_DUR   = 0.20;  // seconds per CoM-shift phase
const CG_COM_AMT   = 18;    // mm lateral CoM shift magnitude
const CG_ORDER     = [0, 3, 1, 2]; // FR, BL, FL, BR
const CG_IS_RIGHT  = new Set([0, 2]); // FR, BR → need left-shift before swing

const CG = {
  active: false,
  bodyX: 0, bodyY: 0,        // body world position
  bodyXStart: 0,             // bodyX at start of current com_shift
  bodyXTarget: 0,            // bodyX target for com_shift
  footW: null,               // [4]×[wx,wy,wz] world-frame foot positions
  phase: 'stance',           // 'stance' | 'com_shift' | 'swing'
  orderIdx: 0,               // index into CG_ORDER
  swingLeg: -1,              // currently swinging leg index (or -1)
  swingT: 0,                 // swing phase progress 0→1
  comT:   0,                 // com_shift phase progress 0→1
  swingFrom: [0, 0],         // world XY where swing started
  swingTo:   [0, 0],         // world XY where foot will land
  lastTS: 0,
  raf: null,
};

// World-frame foot positions at gait start — each foot placed directly outward
// from its hip mount (hip servo = 90°, knee fully down), giving relY = 0 for all
// legs so the first steps phase in naturally in creep order rather than all
// triggering simultaneously.
function cgStandFeet() {
  const cadence   = CG_VELOCITY * (CG_COM_DUR + CG_SWING_DUR); // body advance per step
  const threshold = CG_STEP * 0.45;
  return LEGS.map((leg, i) => {
    const [mx, my] = leg.mount;
    const orderPos = CG_ORDER.indexOf(i);
    const footY    = orderPos * cadence + my - threshold;
    return [mx + leg.dir0[0] * leg.upp, footY, 0];
  });
}

// Solve IK for all 4 legs from current world state and write servo angles
function cgSolveAll() {
  for (let i = 0; i < 4; i++) {
    const leg = LEGS[i];
    const [mx, my, mz] = leg.mount;
    // Hip mount in world frame (body pitch=roll=0)
    const hipW = [CG.bodyX + mx, CG.bodyY + my, BDY.cz + mz];

    // Foot world target (swing uses interpolated arc, stance uses fixed footW)
    let fw;
    if (i === CG.swingLeg) {
      const t = CG.swingT;
      // Parabolic (sine bell) lift: Z = H·sin(π·t)
      fw = [
        CG.swingFrom[0] + (CG.swingTo[0] - CG.swingFrom[0]) * t,
        CG.swingFrom[1] + (CG.swingTo[1] - CG.swingFrom[1]) * t,
        CG_HEIGHT * Math.sin(Math.PI * t),
      ];
    } else {
      fw = CG.footW[i];
    }

    // Foot relative to hip mount in body frame
    applyIKLeg(leg, fw[0]-hipW[0], fw[1]-hipW[1], fw[2]-hipW[2]);
  }
}

function cgTick(ts) {
  if (!CG.active) return;
  const dt = Math.min((ts - CG.lastTS) / 1000, 0.04);
  CG.lastTS = ts;

  if (CG.phase === 'stance') {
    // Body advances forward; feet stay fixed in world → effective backward motion
    CG.bodyY += CG_VELOCITY * dt;

    // Check whether the next-in-order leg needs to swing
    const next = CG_ORDER[CG.orderIdx];
    const leg  = LEGS[next];
    const hipWorldY = CG.bodyY + leg.mount[1];
    const relY = CG.footW[next][1] - hipWorldY; // negative = foot behind hip

    if (relY < -CG_STEP * 0.45) {
      // Trigger CoM shift before swinging
      CG.bodyXTarget = CG_IS_RIGHT.has(next) ? -CG_COM_AMT : CG_COM_AMT;
      CG.bodyXStart  = CG.bodyX;
      CG.comT  = 0;
      CG.phase = 'com_shift';
    }

  } else if (CG.phase === 'com_shift') {
    CG.bodyY += CG_VELOCITY * dt;
    CG.comT += dt / CG_COM_DUR;
    if (CG.comT >= 1) {
      CG.comT    = 1;
      CG.bodyX   = CG.bodyXTarget;

      // Begin swing
      const si  = CG_ORDER[CG.orderIdx];
      const leg = LEGS[si];
      CG.swingLeg  = si;
      CG.swingT    = 0;
      CG.swingFrom = [CG.footW[si][0], CG.footW[si][1]];
      // Land half a stride ahead of hip, aligned with body X
      CG.swingTo = [
        CG.bodyX + leg.mount[0] + leg.dir0[0] * leg.upp * 0.5,
        CG.bodyY + leg.mount[1] + CG_STEP * 0.5,
      ];
      CG.phase = 'swing';
    } else {
      // Ease-in-out lateral shift
      const e = CG.comT < 0.5 ? 2*CG.comT*CG.comT : -1+(4-2*CG.comT)*CG.comT;
      CG.bodyX = CG.bodyXStart + (CG.bodyXTarget - CG.bodyXStart) * e;
    }

  } else { // 'swing'
    CG.bodyY += CG_VELOCITY * dt;
    CG.swingT += dt / CG_SWING_DUR;
    if (CG.swingT >= 1) {
      CG.swingT = 1;
      // Land foot at world target
      CG.footW[CG.swingLeg] = [CG.swingTo[0], CG.swingTo[1], 0];
      CG.swingLeg  = -1;
      CG.orderIdx  = (CG.orderIdx + 1) % 4;
      CG.phase     = 'stance';
    }
  }

  // Sync BDY and camera so render stays body-centred
  BDY.cx = CG.bodyX;
  BDY.cy = CG.bodyY;
  cam.x  = CG.bodyX;
  cam.y  = CG.bodyY;

  cgSolveAll();
  drawRobot();
  CG.raf = requestAnimationFrame(cgTick);
}

function startCreep() {
  stopAnim();
  if (state.gait.active) stopGait();

  // Reset world position and camera
  CG.bodyX = 0; CG.bodyY = 0;
  BDY.cx = 0; BDY.cy = 0;
  cam.x  = 0; cam.y  = 0;

  CG.footW    = cgStandFeet();
  CG.phase    = 'stance';
  CG.orderIdx = 0;
  CG.swingLeg = -1;
  CG.swingT   = 0;
  CG.comT     = 0;
  CG.active   = true;

  setFace('walk', 'loop');
  const btn = document.getElementById('btn-creep');
  if (btn) { btn.textContent = '⏹ Stop Creep'; btn.classList.add('walk-active'); }
  logLine('🦎 creep gait started (world-frame IK)');
  CG.lastTS = performance.now();
  CG.raf = requestAnimationFrame(cgTick);
}

function stopCreep() {
  CG.active = false;
  if (CG.raf) { cancelAnimationFrame(CG.raf); CG.raf = null; }
  CG.swingLeg = -1;

  // Return camera and body to origin
  BDY.cx = 0; BDY.cy = 0;
  cam.x  = 0; cam.y  = 0;

  const btn = document.getElementById('btn-creep');
  if (btn) { btn.textContent = '🦎 Creep'; btn.classList.remove('walk-active'); }
  setFace('stand', 'once');
  Object.entries(STAND).forEach(([k, v]) => {
    state.servos[k] = v;
    const sl = document.getElementById('sv-' + k);
    const vl = document.getElementById('sv-val-' + k);
    if (sl) sl.value = v;
    if (vl) vl.textContent = Math.round(v) + '°';
  });
  drawRobot();
  logLine('⏹ creep stopped');
}

// ─────────────────────────────────────────────────────────────────────────────
// CONTROLS
// ─────────────────────────────────────────────────────────────────────────────
document.getElementById('btn-walk').addEventListener('click', () => {
  if (CG.active) stopCreep();
  if (state.gait.active) stopGait(); else startGait();
});

document.getElementById('btn-creep').addEventListener('click', () => {
  if (CG.active) stopCreep(); else startCreep();
});

document.getElementById('btn-stop').addEventListener('click', () => {
  if (CG.active) stopCreep();
  if (state.gait.active) stopGait();
  stopAnim();
  logLine('■ stopped');
});

const speedSlider = document.getElementById('speed-slider');
const speedVal    = document.getElementById('speed-val');
speedSlider.addEventListener('input', () => {
  state.speed = speedSlider.value / 100;
  state.gait.speed = 1.67 * state.speed;  // scale trot frequency with speed slider — matches firmware ~1.67 Hz
  speedVal.textContent = state.speed.toFixed(2).replace(/\.?0+$/,'') + '×';
});

// Keyboard: W toggles trot gait
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'w' || e.key === 'W') {
    if (state.gait.active) stopGait(); else startGait();
  }
});

// ─────────────────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────────────────
buildServoPanel();
buildCmdGrid();
// Start in STAND so the simulator matches the robot's physical resting pose
Object.entries(STAND).forEach(([k, v]) => {
  state.servos[k] = v;
  const sl = document.getElementById('sv-'+k);
  const vl = document.getElementById('sv-val-'+k);
  if (sl) sl.value = v;
  if (vl) vl.textContent = Math.round(v) + '°';
});
setFace('idle', 'boomerang');
drawRobot();
</script>
